<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3d62"/>
      <stop offset="100%" stop-color="#052c4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.3" r="0.5">
      <stop offset="0%" stop-color="#00b8a9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00b8a9" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Bakgrund -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- BF-text -->
  <text x="540" y="600"
        font-family="Inter, -apple-system, Arial, sans-serif"
        font-size="440"
        font-weight="800"
        fill="white"
        text-anchor="middle"
        letter-spacing="-20">BF</text>

  <!-- "BARA FIBER" undertext -->
  <text x="540" y="780"
        font-family="Inter, -apple-system, Arial, sans-serif"
        font-size="80"
        font-weight="600"
        fill="#00b8a9"
        text-anchor="middle"
        letter-spacing="12">BARA FIBER</text>
</svg>
